<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick's Study Games</title>
<style>
  :root {
    --bg: #fdf6e9;
    --card: #ffffff;
    --ink: #2b2140;
    --muted: #6d6380;
    --line: #e6dccb;
    --accent: #7b4fd6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 6px; font-size: 2.2rem; text-align: center; }
  .sub { margin: 0 0 32px; text-align: center; color: var(--muted); }
  a.app {
    display: flex; align-items: center; gap: 18px;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .1s;
  }
  a.app:hover { border-color: var(--accent); transform: translateY(-2px); }
  .icon { font-size: 2.4rem; line-height: 1; }
  .name { font-size: 1.25rem; font-weight: 800; }
  .desc { color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Nick's Study Games</h1>
  <p class="sub">Pick a game to practice.</p>

  <a class="app" href="Latin/index.html">
    <div class="icon">🏛️</div>
    <div>
      <div class="name">Latin Practice</div>
      <div class="desc">Latin → English, verb endings, and grammar detective.</div>
    </div>
  </a>
</main>
</body>
</html>
